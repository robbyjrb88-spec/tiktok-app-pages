<!DOCTYPE html>
<html>
<head><title>TikTok Authorization</title></head>
<body style="font-family: -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px;">
  <h2>TikTok authorization complete</h2>
  <p>Copy this code and paste it back into the terminal:</p>
  <textarea id="code" readonly style="width:100%; height:80px; font-size:16px; padding:8px;"></textarea>
  <p id="err" style="color:red;"></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    if (code) {
      document.getElementById("code").value = code;
    } else {
      document.getElementById("err").textContent = "Error: " + (error || "no code in callback URL");
    }
  </script>
</body>
</html>
